name: Android APK Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-preview.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # setup-android v3 still attempts to install the obsolete SDK "tools"
      # package, which now fails on hosted runners. Keep its SDK environment
      # setup, but install supported SDK packages explicitly below.
      - name: Set up Android SDK environment
        uses: android-actions/setup-android@v3
        continue-on-error: true
      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Generate Android project and sync web assets
        run: npx cap add android && npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK preview
        uses: actions/upload-artifact@v4
        with:
          name: music-superstar-simulator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
